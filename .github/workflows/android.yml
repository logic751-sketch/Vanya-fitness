name: Build Vanya Fitness APK

on:
  push:
    paths:
      - "VanyaFitness_native_project_20261126.zip"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unpack Android project
        run: unzip -o VanyaFitness_native_project_20261126.zip -d .

      - name: Build debug APK
        run: gradle -p VanyaFitnessNativeStarter assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vanya-Fitness-debug-apk
          path: VanyaFitnessNativeStarter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
